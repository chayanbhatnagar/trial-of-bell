<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellrun · Earnings Season Desk prototype</title>
<style>:root{
  --bg0:#0b0d0e; --bg:#0e1011; --card:#111315; --line:#1c1f23; --rowline:#171a1d; --track:#272c32;
  --btn:#202326; --btnh:#2b2f33; --chip:#24272a; --navon:#191c20; --field:#181b1f; --user:#15181a;
  --text:#e4e8ed; --text2:#9ca7b4; --muted:#7f8897;
  --green:#3bd69d; --coral:#ed7868; --amber:#eab94e; --blue:#78a0ff; --violet:#b69cff;
  --blueink:#14223b; --bluesoft:#202b40; --bluesofth:#28375a;
  --negbg:#2a1917; --posbg:#102c22; --warnbg:#2a2413; --flatbg:#1d2023; --bluebg:#172239; --aibg:#211d33;
  --focusneg:#171213; --focuswarn:#1f1b12; --hoverneg:#2c2021; --hoverwarn:#332b1b; --hoverrow:#181b1e;
  --ease:cubic-bezier(0.32,0.72,0,1); --spring:cubic-bezier(0.34,1.36,0.64,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050607;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---------- Player ---------- */
.player{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(1200px 600px at 50% -10%,#121a14 0%,#060708 60%)}
.pbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #15181b;background:rgba(8,9,10,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:relative;z-index:30;transition:transform .5s var(--ease),opacity .4s var(--ease)}
.pbar .brand{display:flex;align-items:center;gap:8px;min-width:0}
.pbar .brand img{height:16px;display:block}
.pbar .brand span{font-size:12px;color:var(--muted);white-space:nowrap}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#121416;box-shadow:inset 0 0 0 1px #1a1d20;position:relative}
.seg button{position:relative;z-index:1;height:32px;padding:0 14px;border-radius:8px;font-size:12px;font-weight:500;color:var(--text2);white-space:nowrap;transition:color .3s var(--ease)}
.seg button.on{color:var(--text)}
.seg .pill{position:absolute;top:4px;height:32px;border-radius:8px;background:#24272a;box-shadow:0 1px 0 rgba(255,255,255,.05) inset;transition:left .45s var(--ease),width .45s var(--ease);z-index:0}
.pctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.pbtn{height:32px;min-width:32px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#15181b;color:var(--text2);font-size:12px;font-weight:500;transition:background .2s var(--ease),color .2s,transform .2s var(--ease);white-space:nowrap}
.pbtn:hover{background:#1f2326;color:var(--text)}
.pbtn:active{transform:scale(.96)}
.pbtn.acc{background:var(--blue);color:var(--blueink)}
.stepsel{position:relative}
.stepbtn{height:32px;max-width:360px;padding:0 12px;border-radius:8px;background:#15181b;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);transition:background .2s}
.stepbtn:hover{background:#1f2326}
.stepbtn .n{color:var(--muted)}
.stepbtn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepmenu{position:absolute;top:40px;left:0;width:360px;max-height:70vh;overflow:auto;padding:6px;border-radius:14px;background:rgba(22,24,27,.96);backdrop-filter:blur(24px);box-shadow:0 0 0 1px #24282c,0 24px 64px rgba(0,0,0,.55);transform-origin:top left;animation:pop .28s var(--ease)}
.stepmenu button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--text2)}
.stepmenu button:hover{background:#22262a;color:var(--text)}
.stepmenu button.on{color:var(--text);background:#1e2226}
.stepmenu .n{width:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.stagewrap{flex:1;min-height:0;display:grid;place-items:center;position:relative;padding:20px}
.stagebox{position:relative;width:1600px;height:900px;transform-origin:center center;border-radius:14px;box-shadow:0 0 0 1px #1a1d20,0 40px 120px rgba(0,0,0,.6);overflow:hidden;background:var(--bg0)}
.caption{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);white-space:nowrap;transition:opacity .3s}
.player.full .pbar{position:absolute;left:0;right:0;top:0;transform:translateY(-100%);opacity:0}
.player.full .pbar.peek{transform:none;opacity:1}
.player.full .stagewrap{padding:0}
.player.full .stagebox{border-radius:0;box-shadow:none}
.player.full .caption{opacity:0}
.exitfs{position:fixed;top:12px;right:12px;z-index:40;height:32px;padding:0 12px;border-radius:999px;background:rgba(20,22,25,.82);backdrop-filter:blur(16px);color:var(--text);font-size:12px;font-weight:500;display:none;align-items:center;gap:6px;box-shadow:0 0 0 1px #2a2e33;opacity:.35;transition:opacity .3s var(--ease)}
.exitfs:hover{opacity:1}
.player.full .exitfs{display:inline-flex}
.peekzone{position:fixed;left:0;right:0;top:0;height:10px;z-index:35;display:none}
.player.full .peekzone{display:block}
/* overview */
.overview{position:absolute;inset:0;overflow:auto;padding:24px 32px 48px;display:none}
.player.ov .overview{display:block}
.player.ov .stagewrap>.stagebox,.player.ov .caption{display:none}
.ovsec{margin:8px 0 28px}
.ovsec h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.02em}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.ovcard{text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.ovthumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--bg0);box-shadow:0 0 0 1px #1d2124;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.ovcard:hover .ovthumb{transform:translateY(-2px);box-shadow:0 0 0 1.5px var(--blue),0 16px 40px rgba(0,0,0,.5)}
.ovthumb .scaler{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;pointer-events:none}
.ovcard .lbl{font-size:12px;color:var(--text2)}
.ovcard .lbl b{color:var(--text);font-weight:600;margin-right:6px}

/* ---------- App ---------- */
.app{position:absolute;inset:0;display:flex;background:var(--bg0);font-size:13px;line-height:20px;color:var(--text);overflow:hidden}
.app *::-webkit-scrollbar{width:8px;height:8px}
.app *::-webkit-scrollbar-thumb{background:#23272b;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.app *::-webkit-scrollbar-track{background:transparent}
.main{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);view-transition-name:main}
.main.enter{animation:screenIn .55s var(--ease)}
.ws{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.ring{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 2px var(--rc);z-index:5;animation:fadeIn .6s var(--ease)}
@keyframes screenIn{from{opacity:0;transform:translateY(6px) scale(.995);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(59,214,157,.45)}70%{box-shadow:0 0 0 6px rgba(59,214,157,0)}100%{box-shadow:0 0 0 0 rgba(59,214,157,0)}}
@keyframes pulseC{0%{box-shadow:0 0 0 0 rgba(237,120,104,.5)}70%{box-shadow:0 0 0 6px rgba(237,120,104,0)}100%{box-shadow:0 0 0 0 rgba(237,120,104,0)}}
@keyframes dots{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
@keyframes shimmer{from{background-position:-400px 0}to{background-position:400px 0}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(120,160,255,0)}30%{box-shadow:0 0 0 3px rgba(120,160,255,.65)}100%{box-shadow:0 0 0 0 rgba(120,160,255,0)}}
.hot{animation:flash .9s var(--ease)}
.stagger>*{animation:up .5s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.03s}.stagger>*:nth-child(3){animation-delay:.06s}.stagger>*:nth-child(4){animation-delay:.09s}.stagger>*:nth-child(5){animation-delay:.12s}.stagger>*:nth-child(6){animation-delay:.15s}.stagger>*:nth-child(7){animation-delay:.18s}.stagger>*:nth-child(8){animation-delay:.21s}.stagger>*:nth-child(9){animation-delay:.24s}.stagger>*:nth-child(10){animation-delay:.27s}.stagger>*:nth-child(11){animation-delay:.3s}.stagger>*:nth-child(12){animation-delay:.33s}.stagger>*:nth-child(n+13){animation-delay:.36s}
.noanim *, .noanim{animation:none!important;transition:none!important}

/* sidebar */
.side{flex:0 0 248px;width:248px;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;padding:16px 12px;transition:width .5s var(--ease),flex-basis .5s var(--ease),padding .5s var(--ease);overflow:hidden;position:relative}
.side.col{flex-basis:72px;width:72px;padding:16px 12px}
.side .fade{transition:opacity .25s var(--ease),transform .4s var(--ease);white-space:nowrap}
.side.col .fade{opacity:0;transform:translateX(-6px);pointer-events:none}
.logo{display:flex;align-items:center;gap:10px;height:48px;padding:0 4px;position:relative}
.logo .mk{position:absolute;left:10px;top:9px;display:grid;place-items:center;opacity:0;transition:opacity .35s var(--ease);pointer-events:none}
.side.col .logo .mk{opacity:1}
.logo .wm{padding-left:6px}
.logo .wm img{height:15px;display:block}
.logo .wm small{display:block;font-size:12px;line-height:16px;color:var(--muted);margin-top:6px}
.colbtn{position:absolute;right:0;top:8px;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s,right .5s var(--ease),top .5s var(--ease)}
.colbtn:hover{background:var(--navon);color:var(--text)}
.side.col .colbtn{right:auto;left:8px;top:48px}
.side.col .logo{margin-bottom:40px}
.desk{height:40px;border-radius:10px;background:var(--chip);display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;font-size:13px;font-weight:500;transition:background .2s;width:100%;text-align:left}
.desk:hover{background:#2c3033}
.side.col .desk{padding:0;justify-content:center}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{height:38px;border-radius:9px;display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;color:var(--text2);font-size:13.5px;transition:background .2s var(--ease),color .2s;width:100%;text-align:left}
.nav button:hover{background:#15181b;color:var(--text)}
.nav button.on{background:var(--navon);color:var(--text);font-weight:500}
.nav button,.team button,.desk{overflow:hidden}
.side svg,.side .av{flex:0 0 auto}
.nav .ct{margin-left:auto;font-size:11.5px;color:var(--muted)}
.nav .dot{width:7px;height:7px;border-radius:999px;background:var(--coral);animation:pulseC 2s infinite}
.side .hdr{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 8px}
.team{display:flex;flex-direction:column;gap:2px}
.team button{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border-radius:8px;width:100%;text-align:left;transition:background .2s}
.team button:hover{background:#15181b}
.team .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.team .ld{font-size:11.5px;color:var(--muted)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--user);width:100%;text-align:left;transition:background .2s}
.me:hover{background:#1b1e21}
.me .who{flex:1;min-width:0}
.me .who b{display:block;font-size:13px;font-weight:600;line-height:18px}
.me .who span{font-size:11.5px;color:var(--muted)}
.kbd{font-size:11px;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.06);color:var(--text2);line-height:18px}

/* avatars */
.av{position:relative;flex:0 0 auto;border-radius:999px;display:inline-grid;place-items:center;font-weight:600;color:#0b0d0e;font-size:10px;aspect-ratio:1/1;line-height:1;letter-spacing:-.02em;box-sizing:border-box;padding:0}
.av.s20{width:20px;height:20px;font-size:8.5px}.av.s24{width:24px;height:24px;font-size:9.5px}.av.s28{width:28px;height:28px;font-size:10.5px}.av.s32{width:32px;height:32px;font-size:11px}.av.s36{width:36px;height:36px;font-size:12px}.av.s40{width:40px;height:40px;font-size:13px}
.av .pres{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:999px;background:var(--green);box-shadow:0 0 0 2px var(--bg)}
.av.away{opacity:.45}
.av.away .pres{background:var(--muted)}
.av.dash{background:transparent!important;border:1.5px dashed #4a5058}

/* header */
.top{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:16px;line-height:22px;font-weight:600;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--muted);line-height:16px}
.search{white-space:nowrap;display:flex;align-items:center;gap:8px;width:248px;height:36px;padding:0 10px 0 14px;border-radius:999px;background:var(--field);color:var(--muted);font-size:13px;transition:background .2s,box-shadow .2s}
.search:hover{background:#1e2226}
.pillx{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:#181b1b;font-size:12.5px;white-space:nowrap}
.pillx b{font-weight:600}
.live{background:#0d211b;color:var(--green);font-weight:600}
.live i{width:8px;height:8px;border-radius:999px;background:var(--green);animation:pulse 2s infinite}
.live.off{background:#2a2413;color:var(--amber)}
.live.off i{background:var(--amber);animation:none}

/* buttons */
.b{height:32px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .2s var(--ease),color .2s,transform .18s var(--ease),box-shadow .2s;background:var(--btn);color:var(--text)}
.b:hover{background:var(--btnh)}
.b:active{transform:scale(.97)}
.b.pri{background:var(--blue);color:var(--blueink)}
.b.pri:hover{background:#8fb0ff}
.b.soft{background:var(--bluesoft);color:var(--blue)}
.b.soft:hover{background:var(--bluesofth)}
.b.ghost{background:transparent;color:var(--text2);font-weight:500}
.b.ghost:hover{background:#1a1d20;color:var(--text)}
.b.ok{background:var(--posbg);color:var(--green)}
.b.ok:hover{background:#15392c}
.b.lg{height:40px;padding:0 18px;border-radius:10px;font-size:13px}
.b.sm{height:28px;padding:0 10px;font-size:12px}
.b[disabled],.b.dis{background:#1a1d20;color:#5d646d;cursor:not-allowed;transform:none}
.b .cnt{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:rgba(10,11,13,.16);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;line-height:20px}
.b.dis .cnt,.b:not(.pri) .cnt{background:rgba(255,255,255,.08)}
.iconbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text2);background:rgba(255,255,255,.04);transition:background .2s,color .2s,transform .18s var(--ease)}
.iconbtn:hover{background:#1d2023;color:var(--text)}
.iconbtn:active{transform:scale(.94)}

/* cards & labels */
.eyebrow{font-size:11px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.stat{padding:16px 20px;display:flex;flex-direction:column;gap:4px;min-height:96px}
.stat .big{font-size:26px;line-height:34px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .note{font-size:12.5px;color:var(--text2)}
.stat .note.warn{color:var(--amber)}.stat .note.pos{color:var(--green)}.stat .note.flat{color:var(--text2)}
.pipe{display:flex;gap:3px;height:6px;margin-top:10px}
.pipe span{border-radius:3px;transition:flex .6s var(--ease)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--text2);margin-top:10px}
.legend i{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:6px;vertical-align:1px}
.need{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 18px}
.need b{display:block;font-size:13.5px;font-weight:600}
.need span{font-size:12.5px;color:var(--text2)}

/* tabs */
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--line);position:relative}
.tabs button{position:relative;z-index:1;height:32px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text2);transition:color .25s;white-space:nowrap}
.tabs button.on{color:var(--text)}
.tabs button .c{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.tabs .pill{position:absolute;top:4px;height:32px;border-radius:8px;background:var(--chip);transition:left .45s var(--ease),width .45s var(--ease)}

/* table */
.tbl{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.tr{display:grid;grid-template-columns:72px minmax(220px,1fr) 104px 104px 112px 188px 136px 132px 96px;column-gap:12px;align-items:center;padding:0 20px;border-bottom:1px solid var(--rowline);transition:background .22s var(--ease)}
.tr.h{height:44px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.tr.r{height:58px;cursor:pointer}
.tr.r:hover{background:var(--hoverrow)}
.tr.r.fneg{background:var(--focusneg)}
.tr.r.fneg:hover{background:var(--hoverneg)}
.tr.r.fwarn{background:var(--focuswarn)}
.tr.r.fwarn:hover{background:var(--hoverwarn)}
.tr.r.kb{box-shadow:inset 3px 0 0 var(--blue)}
.tr:last-child{border-bottom:0}
.sc b{display:block;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.sc i{display:block;width:40px;height:3px;border-radius:2px;background:var(--track);margin-top:6px;overflow:hidden}
.sc i em{display:block;height:3px;background:var(--text)}
.co b{font-family:var(--mono);font-size:12px;font-weight:600;margin-right:8px}
.co .nm{font-size:14px;font-weight:600}
.co .mt{display:block;font-size:12px;color:var(--muted);line-height:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num b{display:block;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.num span{font-size:11.5px;color:var(--muted)}
.gchip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600}
.own{display:flex;align-items:center;gap:10px;min-width:0}
.own .av{display:grid}
.own div b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.own div span{display:block;font-size:11.5px;color:var(--muted);line-height:16px}
.neg{color:var(--coral)}.pos{color:var(--green)}.warn{color:var(--amber)}.flat{color:var(--text2)}.ai{color:var(--violet)}.acc{color:var(--blue)}.mut{color:var(--muted)}
.bg-neg{background:var(--negbg)}.bg-pos{background:var(--posbg)}.bg-warn{background:var(--warnbg)}.bg-flat{background:var(--flatbg)}.bg-acc{background:var(--bluebg)}.bg-ai{background:var(--aibg)}

/* popover / menus */
.pop{position:absolute;z-index:60;min-width:280px;padding:6px;border-radius:14px;background:rgba(24,27,30,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 0 0 1px #2a2e33,0 24px 64px rgba(0,0,0,.6);transform-origin:top left}
.pop.anim{animation:pop .3s var(--ease)}
.pop .it{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-align:left;transition:background .15s}
.pop .it:hover{background:#262a2e}
.pop .it b{font-weight:500;font-size:13px}
.pop .it small{display:block;font-size:11.5px;color:var(--muted);line-height:15px}
.pop .sep{height:1px;background:#2a2e33;margin:6px 4px}
.pop .ck{margin-left:auto;color:var(--blue)}

/* overlays */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(4,5,6,.58);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.scrim.anim{animation:fadeIn .35s var(--ease)}
.scrim.leave{animation:fadeIn .25s var(--ease) reverse forwards}
.modal{position:absolute;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);padding:6px;border-radius:24px;background:rgba(255,255,255,.035);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 100px rgba(0,0,0,.65)}
.modal.anim{animation:modalIn .5s var(--ease)}
.modal.leave{animation:modalOut .22s var(--ease) forwards}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,-48%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes modalOut{to{opacity:0;transform:translate(-50%,-49%) scale(.98)}}
.core{border-radius:18px;background:#141618;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.sheet{position:absolute;z-index:51;top:8px;right:8px;bottom:8px;width:480px;padding:6px;border-radius:24px;background:rgba(255,255,255,.035);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 100px rgba(0,0,0,.65)}
.sheet.anim{animation:sheetIn .6s var(--ease)}
.sheet.leave{animation:sheetOut .28s var(--ease) forwards}
@keyframes sheetIn{from{transform:translateX(105%)}to{transform:none}}
@keyframes sheetOut{to{transform:translateX(105%)}}
.sheet .core{height:100%;display:flex;flex-direction:column}
.mh{padding:22px 24px 16px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid #1e2124}
.mh h2{margin:4px 0 2px;font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.015em}
.mh p{margin:0;font-size:12.5px;color:var(--text2)}
.mb{padding:16px 24px;display:flex;flex-direction:column;gap:16px}
.mf{padding:16px 24px;display:flex;align-items:center;justify-content:flex-end;gap:8px;border-top:1px solid #1e2124}
.opt{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1px #1e2124;text-align:left;transition:box-shadow .3s var(--ease),background .3s}
.opt:hover{background:#121518}
.opt.on{background:rgba(120,160,255,.07);box-shadow:inset 0 0 0 1.5px var(--blue)}
.opt b{display:block;font-weight:600}
.opt small{display:block;font-size:12px;color:var(--text2);line-height:16px}
.field{width:100%;resize:none;padding:12px 14px;border-radius:12px;border:0;outline:none;background:var(--bg);box-shadow:inset 0 0 0 1px #262a2f;color:var(--text);transition:box-shadow .2s}
.field:focus{box-shadow:inset 0 0 0 1.5px var(--blue)}
.radio{display:grid;gap:4px;padding:4px;border-radius:12px;background:var(--bg0)}
.radio button{height:40px;border-radius:9px;font-weight:600;color:var(--text2);transition:background .3s var(--ease),color .3s,box-shadow .3s}
.radio button:hover{color:var(--text)}
.sw{position:relative;width:36px;height:20px;border-radius:999px;background:#2b2f33;transition:background .3s var(--ease);flex:0 0 36px}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;background:#fff;transition:transform .35s var(--spring);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.on{background:var(--blue)}
.sw.on i{transform:translateX(16px)}

/* toast */
.toasts{position:absolute;right:24px;bottom:24px;z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:16px;background:rgba(30,32,36,.96);backdrop-filter:blur(20px);box-shadow:0 0 0 1px #2c3035,0 24px 64px rgba(0,0,0,.55);animation:toastIn .55s var(--ease);max-width:520px}
.toast.leave{animation:toastOut .3s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.97);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.98)}}
.toast .tt b{display:block;font-weight:600;font-size:13px}
.toast .tt span{font-size:12px;color:var(--text2)}
.toast .ic{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;flex:0 0 28px}
.banner{display:flex;align-items:center;gap:12px;min-height:40px;padding:8px 24px;font-size:12.5px;font-weight:500;border-bottom:1px solid var(--line);animation:fadeIn .4s var(--ease)}
.notif{position:absolute;top:12px;right:24px;z-index:65;width:400px;padding:6px;border-radius:22px;background:rgba(255,255,255,.04);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.6);animation:notifIn .7s var(--ease)}
@keyframes notifIn{from{opacity:0;transform:translateY(-24px) scale(.96)}to{opacity:1;transform:none}}

/* record */
.rtabs{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:4px;padding:0 24px;border-bottom:1px solid var(--line);position:relative}
.rtabs button{height:56px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:13px;font-weight:500;position:relative;transition:color .2s}
.rtabs button:hover{color:var(--text)}
.rtabs button.on{color:var(--text)}
.rtabs .ul{position:absolute;bottom:-1px;height:2px;border-radius:2px;background:var(--text);transition:left .45s var(--ease),width .45s var(--ease)}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,1.05fr) minmax(360px,1fr) minmax(400px,1.05fr)}
.col{min-height:0;overflow:auto;padding:16px 20px 24px}
.col+.col{border-left:1px solid var(--line)}
.claim{display:flow-root;padding-bottom:2px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .35s var(--ease),background .35s var(--ease);margin-bottom:8px}
.claim.sel{background:#15181b;box-shadow:inset 0 0 0 1.5px rgba(120,160,255,.75)}
.claim.edit{box-shadow:inset 0 0 0 2px #5b84e6;background:#191b1e}
.claim .hd{display:block;width:100%;text-align:left;padding:14px 16px 10px}
.claim .l1{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2)}
.claim .l2{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.claim .l2 .v{font-size:22px;line-height:30px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.claim .l2 .c{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.claim .l2 .d{margin-left:auto;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.claim .l3{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.claim .l3 .s{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:600;white-space:nowrap;transition:background .35s var(--ease),color .35s}
.claim .acts{display:flex;gap:6px;padding:0 16px 14px}
.claim .note{margin:0 16px 10px;padding:8px 10px;border-radius:9px;font-size:12px;line-height:16px}
.claim .done{display:flex;align-items:center;gap:8px;padding:0 16px 12px;font-size:11.5px;color:var(--muted)}
.fix{margin:0 16px 16px;padding:18px;border-radius:14px;background:var(--bg0);display:flex;flex-direction:column;gap:12px;animation:up .45s var(--ease)}
.fix h4{margin:0;font-size:15px;font-weight:600}
.fix .sub{font-size:12.5px;color:var(--text2);margin-top:-8px}
.fix .inp{display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;background:#16181b;box-shadow:inset 0 0 0 1px #3a3f45;transition:box-shadow .2s}
.fix .inp:focus-within{box-shadow:inset 0 0 0 1.5px #7d7f88}
.fix .inp input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.fix .inp span{color:var(--muted);font-size:13px}
.fix .q{font-size:12.5px;color:var(--text2)}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reasons button{height:32px;padding:0 14px;border-radius:999px;background:#1c1f23;font-size:12.5px;transition:background .25s var(--ease),color .25s}
.reasons button:hover{background:#25292d}
.reasons button.on{background:var(--blue);color:var(--blueink);font-weight:500}
.fix .help{font-size:12px;line-height:17px;color:var(--muted)}
.cite{display:inline-flex;align-items:center;justify-content:center;height:18px;min-width:18px;padding:0 4px;border-radius:5px;font-size:10px;font-weight:700;vertical-align:2px;transition:background .3s,color .3s;cursor:pointer}
.draft p{margin:0;color:#cfd4da}
.draft .lead{font-size:15.5px;line-height:24px;font-weight:500;color:var(--text);letter-spacing:-.005em}
.doc{padding:24px;border-radius:12px;background:#f3f2ee;color:#1b1b1d;font-size:12px;line-height:18px;box-shadow:0 12px 32px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px}
.doc h3{margin:0;font-size:15px;line-height:20px}
.doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.doc caption{text-align:left;font-weight:700;padding-bottom:4px}
.doc th{color:#6b6b70;font-weight:500;padding:4px;text-align:right}
.doc th:first-child,.doc td:first-child{text-align:left}
.doc td{padding:4px;text-align:right}
.doc .hl{background:#ffe08a;transition:background .4s var(--ease)}
.doc .bad{background:#ffc9c2}
.doc .strike{text-decoration:line-through;color:#8a8a8f}
.doc p.hl,.doc p{padding:2px 4px;border-radius:4px;margin:0}
.chat .msg{display:flex;gap:10px;animation:up .4s var(--ease)}
.chat .msg b{font-weight:600;font-size:12.5px}
.chat .msg .t{font-size:11.5px;color:var(--muted)}
.chat .msg p{margin:2px 0 0;color:#cfd4da}
.typing{display:inline-flex;gap:3px;align-items:center;height:20px}
.typing i{width:5px;height:5px;border-radius:999px;background:var(--text2);animation:dots 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 14px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s}
.composer:focus-within{box-shadow:inset 0 0 0 1.5px #3a4c78}
.composer textarea{flex:1;min-height:20px;max-height:80px;padding:8px 0;border:0;outline:none;background:transparent;resize:none;line-height:20px}
.skel{border-radius:6px;background:linear-gradient(90deg,#16191c 0,#1f2327 120px,#16191c 240px);background-size:800px 100%;animation:shimmer 1.4s infinite linear}
.splash{position:absolute;inset:0;display:grid;place-items:center;background:#121912;overflow:hidden;cursor:pointer}
.splash .f38{position:absolute;inset:0;background:linear-gradient(243.14deg,#877eea 0.2%,#6e63e8 10.3%,#6759ef 20.6%,#5c4de6 30.4%,#5849e4 38.1%,#503ee4 44%,#3f2be2 56.7%,#321fd0 64.8%,#241699 75.8%,#1a0f71 83.8%,#0e0945 92.5%,#0a0634 96.3%,#030118 100%);animation:f38out 1.1s 2.4s var(--ease) forwards}
@keyframes f38out{to{opacity:0;transform:scale(1.04)}}
.splash .lock{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px}
.splash .wm{width:480px;animation:wmIn 1.3s .1s var(--ease) both}
@keyframes wmIn{from{opacity:0;transform:scale(.94);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}
.splash .tag{font-size:19px;color:#e4e8ed;letter-spacing:.005em;animation:tagIn 3.4s .7s var(--ease) both}
@keyframes tagIn{0%{opacity:0;transform:translateY(6px)}25%{opacity:1;transform:none}55%{opacity:1}75%,100%{opacity:0;transform:translateY(-2px)}}
.splash .hint{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:11.5px;color:rgba(255,255,255,.45);animation:fadeIn 1s 3s var(--ease) both}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal .d{min-height:118px;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;text-align:left;transition:background .2s,border-color .2s}
.cal .d:hover{background:#15181b}
.cal .d.out{opacity:.35}
.cal .d.today{border-color:rgba(120,160,255,.6);box-shadow:inset 0 0 0 1px rgba(120,160,255,.35)}
.cal .d.season{background:linear-gradient(180deg,#121a2a 0,var(--card) 70%)}
.yr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.yr .m{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;text-align:left;transition:background .2s,transform .3s var(--ease)}
.yr .m:hover{background:#15181b;transform:translateY(-1px)}
.yr .mg{display:grid;grid-template-columns:repeat(7,16px);gap:4px}
.yr .mg i{width:16px;height:16px;border-radius:4px;background:#181b1f}
</style>

// ---------- Calendar ----------
const CAL_YEAR = 2024; // weekday layout only; the prototype shows no year number
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const POOL = ['VEXO', 'KIRA', 'PLMR', 'GRNT', 'SOLV', 'BRKX', 'ORBX', 'MEDF', 'TRVL', 'HAVN', 'CNTR', 'DRFT', 'LUXE', 'PIKE', 'RIVR', 'SALT', 'TOWN', 'WAVE'];
const SEASONS = [[0, 'Q4 FY25'], [3, 'Q1 FY26'], [6, 'Q2 FY26'], [9, 'Q3 FY26']];
function calCount(m, d) {
  const dow = new Date(CAL_YEAR, m, d).getDay(); if (dow === 0 || dow === 6) return 0;
  const fixed = { '9-21': 1, '9-22': 12, '9-23': 2, '9-24': 4, '9-25': 2 }; if (fixed[m + '-' + d] != null) return fixed[m + '-' + d];
  const inSeason = SEASONS.some(s => (m === s[0] && d >= 13) || (m === s[0] + 1 && d <= 8));
  if (!inSeason) return (d * 3 + m) % 11 === 0 ? 1 : 0;
  return 1 + ((d * 7 + m * 3) % 5) + (m % 3 === 0 && d >= 20 && d <= 26 ? 2 : 0);
}
function calDay(m, d) {
  if (m === 9 && d === 21) return [['TALC', 'LP']];
  if (m === 9 && d === 22) return [['NOVE', 'PR'], ['ORBT', 'AM'], ['ALDN', row('ALDN').owner || ''], ['BRKH', 'AM'], ['+8 more', '']];
  if (m === 9 && d === 24) return [['VEXO', 'PR'], ['KIRA', 'PR'], ['ORBX', 'AM'], ['MEDF', 'TB']];
  if (m === 9 && d === 25) return [['PLMR', 'PR'], ['GRNT', 'SL']];
  const n = calCount(m, d); const own = ['PR', 'AM', 'SL', 'TB', 'LP'];
  return Array.from({ length: Math.min(n, 4) }, (_, i) => [POOL[(d * 5 + m * 7 + i * 3) % POOL.length], own[(d + i + m) % 5]]).concat(n > 4 ? [['+' + (n - 4) + ' more', '']] : []);
}
function seasonOf(m, d) { const s = SEASONS.find(s => (m === s[0] && d >= 13) || (m === s[0] + 1 && d <= 8)); return s ? s[1] : ''; }
function calendarScreen() {

  const fmt = dt => `${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][dt.getDay()]} ${dt.getDate()} ${MONTHS[dt.getMonth()].slice(0, 3)}`;
  const label = v === 'week' ? `Week of ${wsDate.getDate()} ${MONTHS[wsDate.getMonth()]}` : v === 'month' ? MONTHS[m] : 'FY26 · 4 reporting seasons';
  let body = '';
  if (v === 'week') {

    ['Nova lands verified · board updates live', s => { publishNovaOn(s); s.co.ALDN = { owner: 'PR', status: 'owned', stage: 'AI ready', stageT: 'flat' }; s.co.HLDM = { owner: 'AM', status: 'owned', stage: 'AI ready', stageT: 'flat', cover: true }; s._toast = ['Priya published Nova Electronics', 'Negative, High · 7 sources verified · 7:04', { av: 'PR', act: 'go', arg: 'brief', label: 'Open brief' }]; }],
    ['Morning brief · For Maya (lead)', s => { publishNovaOn(s); s.screen = 'brief'; }],
    ["Lead review · Sofia's Crestline record", s => { publishNovaOn(s); rec(s, 'CRST'); s.prevScreen = 'brief'; }],
    ['Request changes from Sofia', s => { publishNovaOn(s); rec(s, 'CRST'); s.ov = { type: 'changes', r: 1 }; }],
    ['Brief after approving Crestline', s => { publishNovaOn(s); s.crst = 'approved'; s.co.CRST = { stage: 'Published', stageT: 'pos' }; s.screen = 'brief'; }],

    ['Switch to Firm-wide', s => { publishNovaOn(s); s.crst = 'approved'; s.screen = 'brief'; s.brief = 'firm'; }],

    ['Calendar · year', s => { s.screen = 'calendar'; s.calView = 'year'; }],

  analyst: { label: 'Analyst flow', who: 'Priya', role: 'analyst', steps: [

    ['Maya assigns Alden Retail · notification', s => { s.notifDone = true; s.assign.ALDN = { to: 'PR', status: 'pendingA', note: MAYA_NOTE }; s.co.ALDN = { owner: 'PR', status: 'pendingA', stage: 'Waiting for Priya', stageT: 'warn' }; s.notif = true; }],
    ['Review the assignment and accept', s => { s.notifDone = true; s.assign.ALDN = { to: 'PR', status: 'pendingA', note: MAYA_NOTE }; s.co.ALDN = { owner: 'PR', status: 'pendingA', stage: 'Waiting for Priya', stageT: 'warn' }; s.ov = { type: 'assignment' }; }],
    ['Nova record · verify AI claims against sources', s => { acc(s); rec(s, 'NOVE'); nova(s); s.sel = 'units'; }],
    ['Correct a misread number', s => { acc(s); rec(s, 'NOVE'); nova(s); s.sel = 'units'; s.editing = 'units'; }],
    ['Type in the discussion; Maya replies', s => { acc(s); rec(s, 'NOVE'); nova(s, { units: 'C' }); s.sel = 'fyguide'; s._chat = 'Units were the nine-month column; corrected to 12.6M. Two claims left.'; }],
    ['Notes', s => { acc(s); rec(s, 'NOVE'); nova(s, { units: 'C' }); s.rtab = 'notes'; }],
    ['History', s => { acc(s); rec(s, 'NOVE'); allNova(s); s.views.NOVE = { stance: 'neg', conf: 'high', reason: 'Guidance cut is demand, not supply. Thesis broken.' }; s.rtab = 'history'; }],

    ['Published', s => { acc(s); rec(s, 'NOVE'); publishNovaOn(s); s._toast = ['Published to 3 audiences', 'Maya got the 3 lines · the board shows it as verified', { act: 'go', arg: 'brief', label: 'Open brief' }]; }],
    ['Team board (analyst view)', s => { acc(s); publishNovaOn(s); s.screen = 'board'; }],
    ["Viewing Arjun's Orbital record (his colour outlines the page)", s => { acc(s); publishNovaOn(s); rec(s, 'ORBT'); s.prevScreen = 'board'; }],

    ['Brief sent', s => { acc(s); publishNovaOn(s); s.screen = 'brief'; s.briefSent = true; }],
    ['Live earnings call companion', s => { acc(s); publishNovaOn(s); s.screen = 'call'; s.clock = '8:44'; }]
  ]},
  errors: { label: 'Error states', who: '', role: 'lead', steps: [
    ['Two people claim the same company', s => { asAnalyst(s); s.screen = 'board'; s.err.collision = true; s.ov = { type: 'collision' }; }],
    ['Live connection lost', s => { s.err.offline = true; }],
    ['Empty day: nothing reporting', s => { s.err.empty = true; }],
    ['Data conflicts inside a record', s => { asAnalyst(s); rec(s, 'NOVE'); s.err.dataerr = true; s.cl.NOVE = { rev: 'V', eps: 'U', gm: 'U', units: 'U', fyguide: 'V', q4eps: 'U', inv: 'V', demand: 'N' }; s.sel = 'eps'; }],
    ['AI unavailable: manual mode', s => { asAnalyst(s); rec(s, 'NOVE'); s.err.aidown = true; s.cl.NOVE = { rev: 'M', eps: 'M', gm: 'M', units: 'M', fyguide: 'M', q4eps: 'M', inv: 'M' }; }],
    ['Publish blocked by unverified claims', s => { asAnalyst(s); rec(s, 'NOVE'); nova(s); s.views.NOVE = { stance: 'neg', conf: 'high', reason: '' }; s.ov = { type: 'publish' }; }],
    ['News arrives after the view is published', s => { asAnalyst(s); rec(s, 'NOVE'); publishNovaOn(s); s.err.stale = true; s.sel = 'gm'; }],
    ['Release not received', s => { rec(s, 'MRDN'); }],
    ['Session expired mid-edit', s => { asAnalyst(s); rec(s, 'NOVE'); nova(s); s.err.expired = true; s.ov = { type: 'expired' }; }],
    ['Analyst passes an assignment back', s => { s.err.declined = true; s.ov = { type: 'assign', to: 'PR', due: 0 }; }]

function acc(s) { s.notifDone = true; s.assign.ALDN = { to: 'PR', status: 'accepted', note: MAYA_NOTE }; s.co.ALDN = { owner: 'PR', status: 'owned', stage: 'AI ready', stageT: 'flat' }; }
function asAnalyst(s) { Object.assign(s, base('analyst'), { notifDone: true }); }
function publishNovaOn(s) { const k = S; S = s; publishNova(false); S = k; s.simDone = true; }
let P_FLOW = 'lead', P_STEP = 0;
function stateFor(flow, i) {
  const F = FLOWS[flow]; const s = base(F.role); s.notifDone = F.role === 'analyst' && i > 2 ? true : s.notifDone; F.steps[i][1](s); return s;
}
function jump(flow, i, fromUser = true) {
  clearTimers(); clearToasts();
  P_FLOW = flow; P_STEP = i;
  S = stateFor(flow, i);
  lastKey = ''; lastOv = null; lastPop = null; leaving = false;
  ['#L-ov', '#L-pop', '#L-notif', '#L-main', '#L-side'].forEach(q => { const e = $(q); if (e) { e.innerHTML = ''; e._h = ''; } });
  if (S.screen === 'splash') later(() => { if (S.screen === 'splash') { S.screen = 'signin'; render(); } }, 5200);
  const t = S._toast; delete S._toast; const ch = S._chat; delete S._chat;
  if (S.screen === 'mydesk' && !S.notifDone) arriveDesk();
  render();
  if (t) setTimeout(() => toast(t[0], t[1], t[2]), 500);
  if (ch) later(() => { const c = $('#chatin'); if (c) { typeInto(c, ch, () => sendChat('NOVE', ch)); } }, 700);
}
function typeInto(el, text, done) { let i = 0; el.focus(); const tick = () => { if (!el.isConnected) return; el.value = text.slice(0, ++i); el.dispatchEvent(new Event('input', { bubbles: true })); if (i < text.length) later(tick, 22); else later(() => { el.value = ''; done(); }, 250); }; tick(); }
function stepBy(d) { const n = FLOWS[P_FLOW].steps.length; const i = Math.max(0, Math.min(n - 1, P_STEP + d)); if (i !== P_STEP) jump(P_FLOW, i); }
const SIGS = {};
function sigOf(s) { return [s.role, s.screen, s.screen === 'record' ? s.rec + s.rtab : s.screen === 'calendar' ? (s.calView || 'week') : '', s.ov ? s.ov.type : '', s.screen === 'brief' ? s.brief : '', s.pop || ''].join('|'); }
function syncStep() {
  if (P_FLOW === 'errors') return;
  const F = FLOWS[P_FLOW];
  if (!SIGS[P_FLOW]) { const keep = S; SIGS[P_FLOW] = F.steps.map((st, i) => { const x = stateFor(P_FLOW, i); return sigOf(x); }); S = keep; }
  const sig = sigOf(S), list = SIGS[P_FLOW];
  if (list[P_STEP] === sig) return;
  let best = -1;
  for (let i = P_STEP + 1; i < list.length; i++) if (list[i] === sig) { best = i; break; }
  if (best < 0) for (let i = P_STEP - 1; i >= 0; i--) if (list[i] === sig) { best = i; break; }
  if (best >= 0) P_STEP = best;
}
function syncPlayer() {
  const F = FLOWS[P_FLOW]; if (!F) return;
  syncStep();
  const b = $('#stepcount'); if (b) b.textContent = `${P_STEP + 1} / ${F.steps.length}`;
  const nb = $('#nextbtn'); if (nb) nb.title = P_STEP + 1 < F.steps.length ? 'Next: ' + F.steps[P_STEP + 1][0] : 'End of flow';
  const pb = $('#prevbtn'); if (pb) pb.title = P_STEP > 0 ? 'Back: ' + F.steps[P_STEP - 1][0] : 'Start of flow';
  document.querySelectorAll('#flowseg button').forEach(x => x.classList.toggle('on', x.dataset.flow === (document.querySelector('.player').classList.contains('ov') ? 'all' : P_FLOW)));
  placeSeg();
}
function placeSeg() { const seg = $('#flowseg'); if (!seg) return; const on = seg.querySelector('button.on'); const p = seg.querySelector('.pill'); if (on && p) { p.style.left = on.offsetLeft + 'px'; p.style.width = on.offsetWidth + 'px'; } }
function stepMenu() {
  const ex = $('#stepmenu'); if (ex) { ex.remove(); return; }
  const F = FLOWS[P_FLOW];
  const m = document.createElement('div'); m.className = 'stepmenu'; m.id = 'stepmenu';
  m.innerHTML = `<div class="eyebrow" style="padding:6px 10px">${F.label}${F.who ? ' · ' + F.who : ''}</div>` + F.steps.map((s, i) => `<button class="${i === P_STEP ? 'on' : ''}" data-step="${i}"><span class="n">${i + 1}</span>${s[0]}</button>`).join('');
  $('#stepsel').appendChild(m);
  m.addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) { jump(P_FLOW, +b.dataset.step); } });
}
function setFlow(f) {
  const pl = $('.player');
  if (f === 'all') { pl.classList.add('ov'); buildOverview(); syncPlayer(); return; }
  pl.classList.remove('ov');
  jump(f, f === 'errors' ? 0 : (P_FLOW === f ? P_STEP : 0));
  fit();
}
let ovBuilt = false;
function buildOverview() {
  if (ovBuilt) return; ovBuilt = true;
  const keep = S; const box = $('#overview'); let html = '';
  Object.keys(FLOWS).forEach(fk => {
    const F = FLOWS[fk];
    html += `<section class="ovsec"><h3>${F.label}${F.who ? ' · ' + F.who : ''}</h3><div class="ovgrid">`;
    F.steps.forEach((st, i) => { S = stateFor(fk, i); delete S._toast; delete S._chat; html += `<div class="ovcard" role="button" tabindex="0" data-ov="${fk}:${i}"><div class="ovthumb"><div class="scaler" inert>${appHTML(true)}</div></div><span class="lbl"><b>${i + 1}</b>${st[0]}</span></div>`; });
    html += '</div></section>';
  });
  S = keep; box.innerHTML = html; scaleThumbs();
}
function scaleThumbs() { document.querySelectorAll('.ovthumb').forEach(t => { const sc = t.querySelector('.scaler'); sc.style.transform = `scale(${t.clientWidth / 1600})`; }); }
function setFull(on) {
  const pl = $('.player');
  if (on) { pl.classList.add('full'); const r = document.documentElement.requestFullscreen; if (r) document.documentElement.requestFullscreen().catch(() => {}); }
  else { pl.classList.remove('full'); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }
  $('#fsbtn').innerHTML = (on ? IC.exitfull(14) + 'Exit full screen' : IC.full(14) + 'Full screen');
  setTimeout(fit, 60);
}
function fit() {
  const w = $('.stagewrap'), b = $('.stagebox'); if (!w || !b) return;
  const full = $('.player').classList.contains('full');
  const pad = full ? 0 : 24;
  const W = w.clientWidth - pad * 2, H = w.clientHeight - pad * 2;
  const s = Math.min(W / 1600, H / 900);
  b.style.position = 'absolute'; b.style.transformOrigin = '0 0';
  b.style.transform = `scale(${s})`;
  b.style.left = (w.clientWidth - 1600 * s) / 2 + 'px'; b.style.top = (w.clientHeight - 900 * s) / 2 + 'px';
  if ($('.player').classList.contains('ov')) scaleThumbs();
}

// ---------- Boot ----------
function boot() {
  document.body.innerHTML = `<div class="player">
    <div class="pbar" id="pbar">
      <div class="brand"><img src="${LOGO_WORD}" alt="Bellrun"><span>Prototype</span></div>
      <div class="seg" id="flowseg"><span class="pill"></span><button data-flow="lead">Lead flow · Maya</button><button data-flow="analyst">Analyst flow · Priya</button><button data-flow="errors">Error states</button><button data-flow="all">${IC.grid(13)} All screens</button></div>
      <div class="pctl">
        <button class="pbtn" id="prevbtn" title="Previous step (←)" aria-label="Previous step">${IC.back(14)}</button>
        <span id="stepcount" class="tnum" style="font-size:12px;color:var(--muted);min-width:44px;text-align:center"></span>
        <button class="pbtn" id="nextbtn" title="Next step (→)" aria-label="Next step">${IC.chevR(14)}</button>
        <button class="pbtn" id="restart" title="Restart this flow">${IC.restart(14)}Restart</button>
        <button class="pbtn" id="hotbtn" title="Show clickable areas">${IC.hand(14)}Hotspots</button>
        <button class="pbtn acc" id="fsbtn">${IC.full(14)}Full screen</button>
      </div>
    </div>
    <div class="peekzone" id="peek"></div>
    <button class="exitfs" id="exitfs">${IC.exitfull(14)}Exit full screen</button>
    <div class="stagewrap"><div class="stagebox"><div class="app" id="app"><aside id="L-side" class="side"></aside><main class="main" id="L-main"></main><div id="L-ring"></div><div id="L-ov"></div><div id="L-pop"></div><div id="L-notif"></div><div class="toasts" id="toasts"></div></div></div>
      <div class="overview" id="overview"></div></div>
  </div>`;
  document.addEventListener('click', onClick, true);
  document.addEventListener('keydown', onKey);
  document.addEventListener('input', onInput);
  $('#flowseg').addEventListener('click', e => { const b = e.target.closest('[data-flow]'); if (b) setFlow(b.dataset.flow); });
  $('#prevbtn').onclick = () => stepBy(-1); $('#nextbtn').onclick = () => stepBy(1);
  $('#restart').onclick = () => jump(P_FLOW, 0);
  $('#hotbtn').onclick = hotspots;
  $('#fsbtn').onclick = () => setFull(!$('.player').classList.contains('full'));
  $('#exitfs').onclick = () => setFull(false);
  $('#overview').addEventListener('click', e => { const c = e.target.closest('[data-ov]'); if (!c) return; const [f, i] = c.dataset.ov.split(':'); $('.player').classList.remove('ov'); jump(f, +i); fit(); });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && $('.player').classList.contains('full')) setFull(false); });
  const pb = $('#pbar'); let peekT;
  $('#peek').addEventListener('mouseenter', () => { pb.classList.add('peek'); });
  pb.addEventListener('mouseleave', () => { clearTimeout(peekT); peekT = setTimeout(() => pb.classList.remove('peek'), 400); });
  window.addEventListener('resize', fit);
  new ResizeObserver(fit).observe($('.stagewrap'));
  jump('lead', 0);
  fit();
  setTimeout(placeSeg, 50);
}
document.addEventListener('DOMContentLoaded', boot);
